<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - PickupFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-name">PickupFinder</div>
    </div>

    <form id="login-form" novalidate>
      <div class="heading">
        <div class="eyebrow">Welcome back</div>
        <h1>Log in</h1>
      </div>

      <p class="notice" id="signed-in-note" hidden></p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>

      <p id="error" class="message" role="alert" aria-live="polite"></p>
      <button type="submit" class="btn dark" id="login-btn">Log in</button>

      <div class="divider"><span>Don't have an account?</span></div>
      <a class="btn" href="registration.html">Register</a>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
