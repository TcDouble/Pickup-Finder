# Lab 10 test stack, adapted for Firebase (approved by the TA): there is no
# PostgreSQL. The `tests` service runs the Mocha suite (test/*.spec.js)
# against the Firebase Auth and Firestore emulators inside the container,
# which start empty on every run.
#
# Run from ProjectSourceCode (copy .env.test.example to .env.test first):
#   docker compose -p lab10-tests -f docker-compose.test.yaml up --abort-on-container-exit --exit-code-from tests
#   docker compose -p lab10-tests -f docker-compose.test.yaml down
# `down --volumes` also clears the cached node_modules and emulator downloads.
name: pickup-finder-test

services:
  tests:
    build:
      # Nothing is copied into the image, so keep the build context tiny.
      context: ./test
      dockerfile_inline: |
        # The Firebase emulators need Java 21, which Debian bookworm doesn't
        # ship, so copy a Java 21 runtime into the lab's pinned Node image.
        FROM eclipse-temurin:21-jre AS java
        FROM node:22.19.0-bookworm
        COPY --from=java /opt/java/openjdk /opt/java/openjdk
        ENV JAVA_HOME=/opt/java/openjdk
        ENV PATH=/opt/java/openjdk/bin:$PATH
    working_dir: /repository
    env_file: .env.test
    environment:
      CI: "true"
    volumes:
      - .:/repository
      - test-node-modules:/repository/node_modules
      # Hide any node_modules installed on the host in firebase/, so the
      # container only uses packages installed inside it.
      - /repository/firebase/node_modules
      - emulator-cache:/root/.cache/firebase/emulators
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm test"]

  # Optional: the events back end's own suite (node:test, 78 tests).
  #   docker compose -f docker-compose.test.yaml --profile firebase up --build --abort-on-container-exit --exit-code-from firebase-tests firebase-tests
  firebase-tests:
    profiles: [firebase]
    build:
      context: ./firebase
      dockerfile_inline: |
        FROM eclipse-temurin:21-jre AS java
        FROM node:22.19.0-bookworm
        COPY --from=java /opt/java/openjdk /opt/java/openjdk
        ENV JAVA_HOME=/opt/java/openjdk
        ENV PATH=/opt/java/openjdk/bin:$PATH
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --include=dev --no-audit --no-fund
        COPY firebase.json firestore.rules firestore.indexes.json events.js firebase-config.js ./
        COPY tests/ ./tests/
    environment:
      CI: "true"
    volumes:
      - emulator-cache:/root/.cache/firebase/emulators
    command: ["npm", "test"]

volumes:
  emulator-cache:
  test-node-modules:
